  <script id="2" type="module">
    // EBCDIC (IBM037) to Unicode lookup for the fallback path.
    // Built from the common cp037 mapping; unmapped bytes become a space.
    const CP037 = (() => {
      const t = new Array(256).fill(" ");
      const put = (start, str) => [...str].forEach((c, i) => (t[start + i] = c));
      put(0x40, " ");
      put(0x4a, "\u00a2.<(+|&");
      put(0x5a, "!$*);\u00ac-/");
      put(0x6a, "\u00a6,%_>?");
      put(0x79, "`:#@'=\"");
      put(0x81, "abcdefghi");
      put(0x91, "jklmnopqr");
      put(0xa1, "~stuvwxyz");
      put(0xc0, "{ABCDEFGHI");
      put(0xd0, "}JKLMNOPQR");
      put(0xe0, "\\ STUVWXYZ");
      put(0xf0, "0123456789");
      return t;
    })();

    function looksAscii(bytes) {
      // Printable ASCII spaces (0x20) and letters dominate in ASCII headers.
      // In EBCDIC, 0x40 is the space and 0xC1-0xE9 are letters.
      let ascii = 0, ebcdic = 0;
      for (const b of bytes) {
        if (b === 0x20 || (b >= 0x41 && b <= 0x7a)) ascii++;
        if (b === 0x40 || (b >= 0xc1 && b <= 0xe9) || (b >= 0xf0 && b <= 0xf9)) ebcdic++;
      }
      return ascii > ebcdic;
    }

    function decodeEbcdic(bytes) {
      try {
        return new TextDecoder("ibm037").decode(bytes);
      } catch {
        return Array.from(bytes, (b) => CP037[b]).join("");
      }
    }

    /**
     * Returns { encoding, lines } where lines is an array of 40 strings of 80 chars.
     */
    function decodeTextHeader(buffer, offset = 0, length = 3200) {
      const bytes = new Uint8Array(buffer, offset, length);
      const ascii = looksAscii(bytes);
      const text = ascii ? new TextDecoder("ascii").decode(bytes) : decodeEbcdic(bytes);
      const lines = [];
      for (let i = 0; i < text.length; i += 80) lines.push(text.slice(i, i + 80).trimEnd());
      return { encoding: ascii ? "ASCII" : "EBCDIC (IBM037)", lines };
    }

  <script id="3" type="module">
    const FORMATS = {
      1: { size: 4, txt: "4-byte IBM floating-point" },
      2: { size: 4, txt: "4-byte two's complement integer" },
      3: { size: 2, txt: "2-byte two's complement integer" },
      5: { size: 4, txt: "4-byte IEEE floating-point" },
      6: { size: 8, txt: "8-byte IEEE floating-point" },
      8: { size: 1, txt: "1-byte two's complement integer" },
      9: { size: 8, txt: "8-byte two's complement integer" },
      10: { size: 4, txt: "4-byte unsigned integer" },
      11: { size: 2, txt: "2-byte unsigned integer" },
      16: { size: 1, txt: "1-byte unsigned integer" }
    };

    const TEXT_HEADER = 3200;
    const BIN_HEADER = 400;
    const TRACE_HEADER = 240;

    function ibmToFloat(u32) {
      const sign = u32 >>> 31 ? -1 : 1;
      const exponent = (u32 >>> 24) & 0x7f;
      const fraction = (u32 & 0x00ffffff) / 0x1000000;
      return sign * fraction * Math.pow(16, exponent - 64);
    }

    class SegY {
      constructor(buffer) {
        this.buffer = buffer;
        const view = new DataView(buffer, TEXT_HEADER, BIN_HEADER);

        // Byte order check: 16909060 (0x01020304) when big endian.
        const marker = view.getInt32(96, false);
        this.littleEndian = marker === 0x04030201;
        const le = this.littleEndian;

        this.binary = {
          jobId: view.getInt32(0, le),
          lineNo: view.getInt32(4, le),
          reelNo: view.getInt32(8, le),
          tracesPerEnsemble: view.getInt16(12, le),
          dt: view.getInt16(16, le),
          ns: view.getInt16(20, le),
          format: view.getInt16(24, le),
          revMajor: view.getUint8(300),
          revMinor: view.getUint8(301),
          fixedLength: view.getInt16(302, le),
          extHeaders: view.getInt16(304, le)
        };
        // Revision 2 extended fields override the 16-bit ones when nonzero.
        const extNs = view.getInt32(68, le);
        if (extNs > 0) this.binary.ns = extNs;

        const fmt = FORMATS[this.binary.format];
        if (!fmt) throw new Error(`Unsupported sample format code ${this.binary.format}`);
        this.fmt = fmt;
        this.dataStart = TEXT_HEADER + BIN_HEADER + Math.max(0, this.binary.extHeaders) * 3200;
        this.traceBytes = TRACE_HEADER + this.binary.ns * fmt.size;
        this.traceCount = Math.floor((buffer.byteLength - this.dataStart) / this.traceBytes);
      }

      traceStart(trace) {
        return this.dataStart + (trace - 1) * this.traceBytes;
      }

      headerInt(trace, offset, size = 4) {
        const view = new DataView(this.buffer, this.traceStart(trace), TRACE_HEADER);
        return size === 2
          ? view.getInt16(offset - 1, this.littleEndian)
          : view.getInt32(offset - 1, this.littleEndian);
      }

      /** Value of one trace header field from the spec, handling 2, 4, 6 and 8 byte fields. */
      headerValue(trace, field) {
        const view = new DataView(this.buffer, this.traceStart(trace), TRACE_HEADER);
        const le = this.littleEndian;
        const o = field.offset - 1;
        switch (field.size) {
          case 2: return view.getInt16(o, le);
          case 4: return view.getInt32(o, le);
          case 6:
            if (o === 218) {
              // vertical, crossline, inline components, in tenths
              return [view.getInt16(o, le), view.getInt16(o + 2, le), view.getInt16(o + 4, le)]
                .map((v) => v / 10).join(", ");
            }
            // 32-bit mantissa and exponent byte, as in the original notebook
            return view.getInt32(o, le) * Math.pow(10, view.getInt8(o + 4));
          case 8: return "0x" + view.getBigUint64(o, le).toString(16);
          default: return null;
        }
      }

      /** 16 and 32 bit signed values at a 1-based byte offset in the 400 byte binary header. */
      binaryValue(offset) {
        const view = new DataView(this.buffer, TEXT_HEADER, BIN_HEADER);
        const o = offset - 1;
        const le = this.littleEndian;
        return {
          int16: o >= 0 && o + 2 <= BIN_HEADER ? view.getInt16(o, le) : null,
          int32: o >= 0 && o + 4 <= BIN_HEADER ? view.getInt32(o, le) : null
        };
      }

      samples(trace) {
        const ns = this.headerInt(trace, 115, 2) || this.binary.ns;
        const n = Math.min(ns, this.binary.ns);
        const view = new DataView(this.buffer, this.traceStart(trace) + TRACE_HEADER, n * this.fmt.size);
        const le = this.littleEndian;
        const size = this.fmt.size;
        const out = new Float32Array(n);
        let min = Infinity, max = -Infinity;
        for (let i = 0; i < n; i++) {
          const p = i * size;
          let v;
          switch (this.binary.format) {
            case 1: v = ibmToFloat(view.getUint32(p, le)); break;
            case 2: v = view.getInt32(p, le); break;
            case 3: v = view.getInt16(p, le); break;
            case 5: v = view.getFloat32(p, le); break;
            case 6: v = view.getFloat64(p, le); break;
            case 8: v = view.getInt8(p); break;
            case 9: v = Number(view.getBigInt64(p, le)); break;
            case 10: v = view.getUint32(p, le); break;
            case 11: v = view.getUint16(p, le); break;
            case 16: v = view.getUint8(p); break;
            default: v = 0;
          }
          out[i] = v;
          if (v < min) min = v;
          if (v > max) max = v;
        }
        return { values: out, min, max };
      }

      /** Reads two 32-bit header words for every trace, e.g. X and Y coordinates. */
      coordinates(offsetX, offsetY, maxPoints = 20000) {
        const step = Math.max(1, Math.floor(this.traceCount / maxPoints));
        const pts = [];
        for (let t = 1; t <= this.traceCount; t += step) {
          pts.push({ trace: t, x: this.headerInt(t, offsetX), y: this.headerInt(t, offsetY) });
        }
        return pts;
      }

      /** Subsampled amplitude matrix for the section viewer. */
      section(centerTrace, halfWindow = 500, maxTraces = 1000, maxSamples = 1000) {
        const first = Math.max(1, centerTrace - halfWindow);
        const last = Math.min(this.traceCount, centerTrace + halfWindow);
        const tStep = Math.max(1, Math.ceil((last - first + 1) / maxTraces));
        const sStep = Math.max(1, Math.ceil(this.binary.ns / maxSamples));
        const cols = [];
        let min = Infinity, max = -Infinity;
        for (let t = first; t <= last; t += tStep) {
          const s = this.samples(t);
          if (s.min < min) min = s.min;
          if (s.max > max) max = s.max;
          const col = new Float32Array(Math.ceil(s.values.length / sStep));
          for (let i = 0, j = 0; i < s.values.length; i += sStep, j++) col[j] = s.values[i];
          cols.push(col);
        }
        return { cols, min, max, first, last, tStep, sStep, dt: this.binary.dt * sStep / 1e6 };
      }
    }

    /** Reads a File (or Observable FileAttachment) in chunks and reports progress. */
    async function readFile(file, onProgress = () => {}) {
      // Inputs.file gives a FileAttachment-like object whose stream() is async.
      const stream = await file.stream();
      const reader = stream.getReader();
      const size = file.size || 0;
      const chunks = [];
      let total = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        total += value.length;
        if (size) onProgress(total / size);
      }
      const out = new Uint8Array(total);
      let pos = 0;
      for (const c of chunks) { out.set(c, pos); pos += c.length; }
      return out.buffer;
    }

  <script id="4" type="module">
    // Pick "nice" tick values (1, 2, 5 x 10^k) inside [min, max].
    function niceTicks(min, max, count, minStep = 0) {
      const range = Math.max(max - min, 1e-12);
      const raw = range / Math.max(1, count);
      const pow = Math.pow(10, Math.floor(Math.log10(raw)));
      const f = raw / pow;
      const nice = f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10;
      const step = Math.max(nice * pow, minStep);
      const decimals = Math.max(0, Math.ceil(-Math.log10(step) - 1e-9));
      const values = [];
      for (let v = Math.ceil(min / step - 1e-9) * step; v <= max + step * 1e-9; v += step) {
        values.push(Math.round(v / step) * step);
      }
      return { values, decimals };
    }

    function sectionViewer(
      section,
      { width = 900, height = 600, contrast = 0.2, brightness = 0.5, smooth = true, invert = false } = {}
    ) {
      const margin = { top: 10, right: 15, bottom: 48, left: 62 };
      const pw = Math.max(50, width - margin.left - margin.right); // plot area size in canvas pixels
      const ph = Math.max(50, height - margin.top - margin.bottom);

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.style.cssText = "display:block;width:100%;max-width:" + width + "px;cursor:grab;touch-action:none";
      const ctx = canvas.getContext("2d");

      const cols = section.cols.length;
      const rows = section.cols[0].length;

      // Render the amplitude data once into an offscreen canvas.
      const off = document.createElement("canvas");
      off.width = cols;
      off.height = rows;
      const octx = off.getContext("2d");
      const img = octx.createImageData(cols, rows);
      const range = section.max - section.min || 1;
      // (Re)render the grey scale image; needed again only when contrast, brightness or invert change.
      function renderImage() {
        const stretch = (v) => (v - 127.5 + (brightness - 0.5) * 255) / (1 - contrast) + 127.5;
        for (let x = 0; x < cols; x++) {
          const col = section.cols[x];
          for (let y = 0; y < rows; y++) {
            const g = Math.max(0, Math.min(255, stretch(((col[y] - section.min) / range) * 255)));
            const i = (y * cols + x) * 4;
            const v = invert ? 255 - g : g;
            img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
            img.data[i + 3] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
      }
      renderImage();

      // Scale x and y independently so the section always fills the plot area.
      // Zoom changes both by the same factor. tx, ty are relative to the plot area origin.
      const fit = () => ({ sx: pw / cols, sy: ph / rows });
      let { sx, sy } = fit();
      let tx = 0, ty = 0;
      const reset = () => { ({ sx, sy } = fit()); tx = ty = 0; draw(); };

      // Image column c (continuous, cell i centered at i + 0.5) <-> trace number, row r <-> time in s.
      const traceAt = (c) => section.first + (c - 0.5) * section.tStep;
      const colOf = (trace) => (trace - section.first) / section.tStep + 0.5;
      const timeAt = (r) => (r - 0.5) * section.dt;
      const rowOf = (time) => time / section.dt + 0.5;

      function draw() {
        const cs = getComputedStyle(canvas);
        const fg = cs.color || "#888";
        const font = `12px ${cs.fontFamily || "sans-serif"}`;
        ctx.clearRect(0, 0, width, height);

        // image, clipped to the plot area
        ctx.save();
        ctx.beginPath();
        ctx.rect(margin.left, margin.top, pw, ph);
        ctx.clip();
        ctx.imageSmoothingEnabled = smooth;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(off, margin.left + tx, margin.top + ty, cols * sx, rows * sy);
        ctx.restore();

        // axes
        ctx.strokeStyle = fg;
        ctx.fillStyle = fg;
        ctx.lineWidth = 1;
        ctx.font = font;
        ctx.globalAlpha = 0.7;
        ctx.strokeRect(margin.left + 0.5, margin.top + 0.5, pw, ph);

        // horizontal axis: trace number
        const c0 = (0 - tx) / sx, c1 = (pw - tx) / sx;
        const xt = niceTicks(Math.min(traceAt(c0), traceAt(c1)), Math.max(traceAt(c0), traceAt(c1)), Math.floor(pw / 90), 1);
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        for (const v of xt.values) {
          const px = Math.round(margin.left + tx + colOf(v) * sx) + 0.5;
          if (px < margin.left || px > margin.left + pw) continue;
          ctx.beginPath();
          ctx.moveTo(px, margin.top + ph);
          ctx.lineTo(px, margin.top + ph + 5);
          ctx.stroke();
          ctx.fillText(v.toFixed(xt.decimals), px, margin.top + ph + 8);
        }

        // vertical axis: time in s, increasing downwards
        const r0 = (0 - ty) / sy, r1 = (ph - ty) / sy;
        const yt = niceTicks(Math.min(timeAt(r0), timeAt(r1)), Math.max(timeAt(r0), timeAt(r1)), Math.floor(ph / 45));
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        for (const v of yt.values) {
          const py = Math.round(margin.top + ty + rowOf(v) * sy) + 0.5;
          if (py < margin.top || py > margin.top + ph) continue;
          ctx.beginPath();
          ctx.moveTo(margin.left - 5, py);
          ctx.lineTo(margin.left, py);
          ctx.stroke();
          ctx.fillText(v.toFixed(yt.decimals), margin.left - 8, py);
        }

        // axis titles
        ctx.globalAlpha = 1;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText("trace No", margin.left + pw / 2, height - 3);
        ctx.save();
        ctx.translate(13, margin.top + ph / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textBaseline = "top";
        ctx.fillText("time in s", 0, 0);
        ctx.restore();

        drawLegend(fg, font);
      }

      // Amplitude color scale in the top left corner of the plot, as in the original notebook.
      // Vertical bar spanning the amplitudes that map to black and white after contrast and brightness.
      // Plain decimal labels (no scientific notation) with about 3 significant digits.
      const formatAmp = (v) => {
        if (v === 0) return "0";
        const digits = Math.min(20, Math.max(0, 2 - Math.floor(Math.log10(Math.abs(v)))));
        const s = v.toFixed(digits);
        return s.includes(".") ? s.replace(/\.?0+$/, "") : s;
      };
      function pageBackground(fg) {
        for (const el of [document.body, document.documentElement]) {
          const c = getComputedStyle(el).backgroundColor;
          if (c && c !== "transparent" && !/rgba\(.*,\s*0\)$/.test(c)) return c;
        }
        const m = /\d+/.exec(fg || "");
        return m && +m[0] > 128 ? "#14171c" : "#ffffff"; // light text implies a dark page
      }
      function drawLegend(fg, font) {
        const bw = 14, bh = 100, pad = 6, gap = 7;
        const bx = margin.left + 10, by = margin.top + 10;
        const ampAt = (G) =>
          section.min + (((G - 127.5) * (1 - contrast) + 127.5 - (brightness - 0.5) * 255) / 255) * range;
        const a0 = ampAt(0), a1 = ampAt(255);
        if (!(a1 > a0)) return;
        const top = formatAmp(a1), bottom = formatAmp(a0);

        ctx.save();
        ctx.font = font;
        const textW = (s) => (ctx.measureText(s) || { width: 40 }).width;
        const labelW = Math.max(textW(top), textW(bottom));
        const inner = Math.max(textW("amplitude"), bw + gap + labelW);
        const boxW = inner + 2 * pad, boxH = pad + 16 + bh + pad;

        ctx.globalAlpha = 0.8;
        ctx.fillStyle = pageBackground(fg);
        ctx.fillRect(bx, by, boxW, boxH);
        ctx.globalAlpha = 1;
        ctx.fillStyle = fg;
        ctx.strokeStyle = fg;
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("amplitude", bx + pad, by + pad);

        const gx = bx + pad, gy = by + pad + 16;
        const grad = ctx.createLinearGradient(0, gy, 0, gy + bh);
        grad.addColorStop(0, invert ? "#000000" : "#ffffff"); // high amplitude at the top
        grad.addColorStop(1, invert ? "#ffffff" : "#000000");
        ctx.fillStyle = grad;
        ctx.fillRect(gx, gy, bw, bh);
        ctx.fillStyle = fg;
        ctx.globalAlpha = 0.7;
        ctx.strokeRect(gx + 0.5, gy + 0.5, bw, bh);
        ctx.globalAlpha = 1;

        // labeled ticks at the two extremes only
        for (const y of [gy + 0.5, gy + bh + 0.5]) {
          ctx.beginPath();
          ctx.moveTo(gx + bw, y);
          ctx.lineTo(gx + bw + 4, y);
          ctx.stroke();
        }
        ctx.textBaseline = "top";
        ctx.fillText(top, gx + bw + gap, gy);
        ctx.textBaseline = "bottom";
        ctx.fillText(bottom, gx + bw + gap, gy + bh);
        ctx.restore();
      }

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const r = canvas.getBoundingClientRect();
        const mx = ((e.clientX - r.left) / r.width) * width - margin.left;
        const my = ((e.clientY - r.top) / r.height) * height - margin.top;
        const k = Math.exp(-e.deltaY * 0.001);
        tx = mx - (mx - tx) * k;
        ty = my - (my - ty) * k;
        sx *= k;
        sy *= k;
        draw();
      }, { passive: false });

      let drag = null;
      canvas.addEventListener("pointerdown", (e) => {
        drag = { x: e.clientX, y: e.clientY, tx, ty };
        canvas.setPointerCapture(e.pointerId);
        canvas.style.cursor = "grabbing";
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const r = canvas.getBoundingClientRect();
        tx = drag.tx + ((e.clientX - drag.x) / r.width) * width;
        ty = drag.ty + ((e.clientY - drag.y) / r.height) * height;
        draw();
      });
      const endDrag = () => { drag = null; canvas.style.cursor = "grab"; };
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);
      canvas.addEventListener("dblclick", reset);

      // Axis colors come from the page's text color, so redraw when the theme changes.
      const redraw = () => { if (canvas.isConnected) draw(); else stop(); };
      const observer = new MutationObserver(redraw);
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      media.addEventListener("change", redraw);
      function stop() {
        observer.disconnect();
        media.removeEventListener("change", redraw);
      }

      // Change display options in place, keeping the current zoom and pan.
      canvas.update = (o = {}) => {
        const imageChanged =
          (o.contrast !== undefined && o.contrast !== contrast) ||
          (o.brightness !== undefined && o.brightness !== brightness) ||
          (o.invert !== undefined && o.invert !== invert);
        if (o.contrast !== undefined) contrast = o.contrast;
        if (o.brightness !== undefined) brightness = o.brightness;
        if (o.invert !== undefined) invert = o.invert;
        if (o.smooth !== undefined) smooth = o.smooth;
        if (imageChanged) renderImage();
        draw();
      };

      draw();
      requestAnimationFrame(draw); // once attached, the computed text color is available
      return canvas;
    }
  </script>
  <script id="5" type="module">
    // Generated from the specTraceHeader table of the original notebook (all 87 fields).
    const TRACE_HEADER_FIELDS = [
      {"offset": 1, "size": 4, "range": "1-4", "name": "tracl", "description": "Trace sequence number within line – numbers continue to increase if additional reels are required on same line."},
      {"offset": 5, "size": 4, "range": "5-8", "name": "tracr", "description": "Trace sequence number within reel – each reel starts at trace number one."},
      {"offset": 9, "size": 4, "range": "9-12", "name": "fldr", "description": "Original field record number."},
      {"offset": 13, "size": 4, "range": "13-16", "name": "tracf", "description": "Trace number within the original field record."},
      {"offset": 17, "size": 4, "range": "17-20", "name": "ep", "description": "Energy source point number – used when more than one record occurs at the same effective surface location."},
      {"offset": 21, "size": 4, "range": "21-24", "name": "cdp", "description": "Ensemble number: CDP, CMP, CRP, etc."},
      {"offset": 25, "size": 4, "range": "25-28", "name": "cdpt", "description": "Trace number within the CDP ensemble – each ensemble starts with trace number one."},
      {"offset": 29, "size": 2, "range": "29-30", "name": "trid", "description": "Trace identification code. -1=other, 0=unknown, 1=seismic, 2=dead, 3=dummy, 4=time-break, 5=uphole, 6=sweep, 7=timing, 8=water-break, etc."},
      {"offset": 31, "size": 2, "range": "31-32", "name": "nvs", "description": "Number of vertically summed traces yielding this trace. (1 is one trace, 2 is two summed traces, etc.)"},
      {"offset": 33, "size": 2, "range": "33-34", "name": "nhs", "description": "Number of horizontally stacked traces yielding this trace. (1 is one trace, 2 is two stacked traces, etc.)"},
      {"offset": 35, "size": 2, "range": "35-36", "name": "duse", "description": "Data use: 1=production, 2=test."},

  <script id="8" type="module">
    const file = view(Inputs.file({label: "SEG-Y file", accept: ".sgy,.segy"}));
  </script>
  <script id="9" type="module">
    const exampleName = "stk00819t_first5.sgy";
    const sourceName = file ? file.name : `${exampleName} (included example file)`;
    const progress = html`<progress value=0 max=1 style="width:100%"></progress>`;
    display(progress);
    const segy = new SegY(
      file
        ? await readFile(file, (p) => (progress.value = p))
        : exampleSgy
    );
    progress.remove();
  </script>
  <script id="10" type="module">
    display(html`<p>File <b>${sourceName}</b> has <b>${segy.buffer.byteLength.toLocaleString()}</b> bytes, ${segy.traceCount.toLocaleString()} traces.${file ? "" : " Choose a file above to analyse your own data instead."}</p>`);
  </script>
  <script id="11" type="text/markdown">
    ## 2. Text header
  </script>
  <script id="12" type="module">
    if (segy) {
      const h = decodeTextHeader(segy.buffer);
      display(html`<p>Encoding detected: <b>${h.encoding}</b></p>
        <pre style="font-size:10px;line-height:1.2">${h.lines.join("\n")}</pre>`);
    }
  </script>
  <script id="13" type="text/markdown">
    ## 3. Binary Header
  </script>
  <script id="14" type="module">
    const customOffset = view(Inputs.number([1, 399], {label: "custom offset", value: 27, step: 1, placeholder: "1 to 399"}));
  </script>
  <script id="15" type="module">
    if (segy) {
      const b = segy.binary;
      const rows = [
        {offset: "1-4", description: "job id", value: b.jobId},
        {offset: "5-8", description: "(in-)line number", value: b.lineNo},
        {offset: "9-12", description: "reel number", value: b.reelNo},
        {offset: "17-18", description: "sample interval in µs", value: b.dt},
        {offset: "21-22", description: "number of samples", value: b.ns},
        {offset: "25-26", description: "data format code", value: `${b.format} (${segy.fmt.txt})`},
        {offset: "301-302", description: "SEG-Y revision", value: `${b.revMajor}.${b.revMinor}`},
        {offset: "303-304", description: "trace length fixed", value: `${b.fixedLength} (${b.fixedLength ? "use 21-22" : "use 115-116 in trace header"})`},
        {offset: "-", description: "byte order", value: segy.littleEndian ? "little endian" : "big endian"}
      ];
      if (Number.isInteger(customOffset) && customOffset >= 1 && customOffset <= 399) {
        const c = segy.binaryValue(customOffset);
        rows.push({offset: `${customOffset}-${customOffset + 1}`, description: "custom field 16bit", value: c.int16 ?? "out of range"});
        rows.push({offset: `${customOffset}-${customOffset + 3}`, description: "custom field 32bit", value: c.int32 ?? "out of range"});
      } else {
        rows.push({offset: "-", description: "custom field", value: "enter an offset from 1 to 399"});
      }
      display(Inputs.table(rows, {layout: "auto", rows: 20}));
    }
  </script>
  <script id="16" type="text/markdown">
    ## 4. Trace Header Values and Plots

    Values of the trace header fields for the first trace, the selected trace, and the last trace. The custom offset adds 16 bit and 32 bit values at any byte offset of the 240 byte trace header.
  </script>
  <script id="17" type="module">
    const traceNo = view(Inputs.range([1, segy?.traceCount ?? 1], {label: "trace to analyse", step: 1, value: Math.floor((segy?.traceCount ?? 1) / 2)}));
  </script>
  <script id="18" type="module">
    const traceOffset = view(Inputs.number([1, 237], {label: "custom offset", value: 21, step: 1, placeholder: "1 to 237"}));
  </script>
  <script id="19" type="module">
    if (segy) {
      const last = segy.traceCount;
      const custom = Number.isInteger(traceOffset) && traceOffset >= 1 && traceOffset <= 237;
      const rows = [];
      if (custom) {
        rows.push({offset: traceOffset, shortName: "custom 16 bit",
          first: segy.headerInt(1, traceOffset, 2), value: segy.headerInt(traceNo, traceOffset, 2), last: segy.headerInt(last, traceOffset, 2)});
        rows.push({offset: traceOffset, shortName: "custom 32 bit",
          first: segy.headerInt(1, traceOffset, 4), value: segy.headerInt(traceNo, traceOffset, 4), last: segy.headerInt(last, traceOffset, 4)});
      } else {
        rows.push({offset: "-", shortName: "custom", first: "enter an offset from 1 to 237", value: "", last: ""});
      }
      for (const f of TRACE_HEADER_FIELDS) {
        rows.push({offset: f.offset, shortName: f.name,
          first: segy.headerValue(1, f), value: segy.headerValue(traceNo, f), last: segy.headerValue(last, f)});
      }
      display(Inputs.table(rows, {rows: 20, layout: "auto"}));
    }
  </script>
  <script id="20" type="module">

  <script id="22" type="text/markdown">
    ## 5. Trace Data

    Shows the trace selected in section 4.
  </script>
  <script id="23" type="module">
    if (segy) {
      const s = segy.samples(traceNo);
      const n = s.values.length;
      const maxSamples = Math.min(500, n);
      const stride = Math.max(1, Math.floor(n / maxSamples));

      display(Inputs.table([{"samples min": s.min, "samples max": s.max}]));

      // Histogram of up to 500 non-zero samples
      const nonZero = [];
      for (let i = 0; i < n; i += stride) if (s.values[i] !== 0) nonZero.push(s.values[i]);
      display(Plot.plot({
        width,
        height: 140,
        title: `histogram (zeros not counted), ${nonZero.length} out of ${n} samples`,
        y: {label: "count"},
        x: {label: "amplitude"},
        marks: [Plot.rectY(nonZero, Plot.binX({y: "count"}, {thresholds: 30, fill: "steelblue", tip: true}))]
      }));

      // Color coded amplitude strip, one cell per (subsampled) sample
      const strip = [];
      for (let i = 0; i < n; i += stride) strip.push({index: i, data: s.values[i]});
      display(Plot.plot({
        width,
        height: 90,
        marginBottom: 35,
        x: {label: "sample number"},
        y: {axis: null},
        color: {type: "linear", scheme: "ylgnbu", legend: true, label: "amplitude"},
        marks: [Plot.rect(strip, {x1: "index", x2: (d) => d.index + stride, fill: "data", tip: true})]
      }));
    }
  </script>
